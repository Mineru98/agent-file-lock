name: release

on:
  push:
    tags: ["v*"]
  # Lets a release be re-run for an existing tag without pushing a new one.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.1.2)
        required: true

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushing the cask to Mineru98/homebrew-tap needs a token that can
          # write to that repo. If the secret is absent this is the empty
          # string and goreleaser skips the cask instead of failing.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
