# Release tooling only; not a runtime dependency.
version: 2
project_name: afl
builds:
  - main: ./cmd/afl
    binary: afl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - afl.yaml.example
      # Shipped as files so the cask never has to execute the binary at
      # install time (an unsigned binary is blocked by Gatekeeper until the
      # quarantine bit is stripped, which only happens in postflight).
      - src: internal/completion/afl.bash
        dst: completions/afl.bash
      - src: internal/completion/_afl
        dst: completions/afl.zsh
      - src: internal/completion/afl.fish
        dst: completions/afl.fish
checksum:
  name_template: checksums.txt
release:
  draft: false
  prerelease: auto
  # `mode` only governs the release notes.
  mode: replace
  # Without this, re-running a release (or a workflow run that races with a
  # manual publish) dies with a 422 already_exists on every asset. With it,
  # goreleaser deletes the conflicting asset and retries the upload.
  replace_existing_artifacts: true
  footer: |
    ## Install

    **Linux and macOS — release binary for this machine**

    ```sh
    curl -fsSL https://raw.githubusercontent.com/Mineru98/agent-file-lock/main/install.sh | AFL_VERSION={{ .Tag }} sh
    ```

    **macOS — Homebrew cask (shell completions included)**

    ```sh
    brew install Mineru98/tap/afl
    ```

    **Any platform with a Go toolchain**

    ```sh
    go install github.com/Mineru98/agent-file-lock/cmd/afl@{{ .Tag }}
    ```

    ## Update

    Update the way you installed — each command replaces the binary in place.
    Nothing else has to be redone: the hook config calls `afl` by name off your
    `PATH`, and locks are kernel flags on the files themselves, so both survive
    the swap untouched.

    **Linux and macOS — release binary for this machine**

    ```sh
    curl -fsSL https://raw.githubusercontent.com/Mineru98/agent-file-lock/main/install.sh | AFL_VERSION={{ .Tag }} sh
    ```

    **macOS — Homebrew cask**

    ```sh
    brew update && brew upgrade --cask Mineru98/tap/afl
    ```

    **Any platform with a Go toolchain**

    ```sh
    go install github.com/Mineru98/agent-file-lock/cmd/afl@{{ .Tag }}
    ```

    Then check which build you ended up on:

    ```sh
    afl version
    ```

# Homebrew formulae for third-party binaries are deprecated; casks are the
# supported path. Casks are macOS-only — Linux users install with `go install`
# or the release tarball.
homebrew_casks:
  - name: afl
    binaries: [afl]
    # Skipped unless a token that can write to Mineru98/homebrew-tap is present,
    # so a release from CI with only the repo-scoped GITHUB_TOKEN still succeeds.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: Mineru98
      name: homebrew-tap
      branch: main
      # goreleaser requires a bare {{ .Env.VAR }} here, so the workflow must
      # always define HOMEBREW_TAP_TOKEN (empty is fine — skip_upload handles it).
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    homepage: https://github.com/Mineru98/agent-file-lock
    description: Lock files against coding agents with OS-level immutable flags
    license: MIT
    completions:
      bash: completions/afl.bash
      zsh: completions/afl.zsh
      fish: completions/afl.fish
    # The binary is not signed with an Apple Developer ID, so Gatekeeper
    # blocks it on first run. Strip the quarantine bit at install time, which
    # is the standard remedy for unsigned binaries distributed as casks.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"], print_stderr: false).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/afl"]
          end
    caveats: |
      Strong locks (chflags schg) need root:
        sudo afl lock -f afl.yaml
      Verifying needs no privileges:
        afl check -f afl.yaml
